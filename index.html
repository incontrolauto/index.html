<body>
<div class="container">
<div class="sticky-header">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
  <h1 style="margin-bottom:0">100 行事曆</h1>
  <span class="sync-badge sync-loading" id="sync-badge"><span class="sync-dot"></span><span id="sync-text">連線中</span></span>
</div>
<div class="top-bar">
  <div class="view-toggle">
    <button class="view-btn" onclick="setView('month',this)">📅 月曆</button>
    <button class="view-btn on" onclick="setView('list',this)">📋 行事曆</button>
  </div>
</div>
<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
  <button class="note-btn" id="note-page-btn" onclick="toggleNotebook(this)">📓 記事本</button>
  <button class="global-add-btn" id="global-add-btn" onclick="openAdd(event,null)">＋ 新增行程</button>
</div>
</div>
<div class="stats">
  <div class="stat on" id="stat-all" onclick="setSchedCard('all')"><div class="stat-label">總天數</div><div class="stat-num" id="stotal">100</div></div>
  <div class="stat" id="stat-has" onclick="setSchedCard('has')"><div class="stat-label">有行程</div><div class="stat-num" id="shas">0</div></div>
  <div class="stat" id="stat-none" onclick="setSchedCard('none')"><div class="stat-label">無行程</div><div class="stat-num" id="snone">0</div></div>
</div>
<div class="filter-section" id="filter-section">
  <div class="filter-row">
    <button class="who-btn who-d" onclick="setWho('d',this)">丁哥</button>
    <button class="who-btn who-a" onclick="setWho('a',this)">阿多</button>
    <button class="who-btn who-c" onclick="setWho('c',this)">可可</button>
    <button class="who-btn who-f" onclick="setWho('f',this)">全家</button>
  </div>
</div>
<div id="cal"></div>
<div class="notebook-page" id="notebook-page">
  <textarea class="nb-textarea" id="nb-textarea" placeholder=""></textarea>
  <div id="note-hint" style="display:none;font-size:12px;color:#bbb;margin-top:8px;text-align:left">記事本內容未同步</div>
</div>
<div id="modal-container"></div>
<div class="save-toast" id="toast">✓ 已儲存</div>
</div>
<script>
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const DOW=['日','一','二','三','四','五','六'];
function pad(n){return String(n).padStart(2,'0')}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function tclass(w){return w==='d'?'td':w==='a'?'ta':w==='c'?'tc':'tf'}
function tlabel(w){return w==='d'?'丁哥':w==='a'?'阿多':w==='c'?'可可':'全家'}
function sortKey(t){if(!t)return 9999;const m=t.match(/(\d{1,2}):(\d{2})/);return m?parseInt(m[1])*100+parseInt(m[2]):9999;}

const ORIG_START=new Date(2026,4,24);

// 永遠維持「今天開始往後 100 天」
// 若今天尚未到原始開始日，則仍從原始日開始
const calStart=TODAY>ORIG_START?new Date(TODAY):new Date(ORIG_START);
const calEnd=addDays(calStart,99);

// ===== Google Sheet API =====

const API_URL =
'https://script.google.com/macros/s/AKfycbxOuBY64BC-0ZNTHndvywPukS0mkM6cdoeKwmByL3b0Fo9VSE-3lcuhC1uRaVK-9cyF/exec';


// ===== 資料 =====

const STORE_KEY='huang_cal_v2';

let overrideEvs={},
    extraEvs={},
    deletedIds=new Set(),
    evIdCounter=9000;


// ===== 載入 =====

async function loadStore(){

  try{

    // 先讀 localStorage（避免首次空白）

    const raw =
      localStorage.getItem(STORE_KEY);

    if(raw){

      const s =
        JSON.parse(raw);

      extraEvs =
        s.extraEvs || {};

      overrideEvs =
        s.overrideEvs || {};

      deletedIds =
        new Set(s.deletedIds || []);

      evIdCounter =
        s.counter || 9000;

    }

  }catch(e){

    console.error('local load error',e);

  }


  try{

    // 再讀 Google Sheet 雲端

    const res = await fetch(
  API_URL + '?action=load'
);

    const cloud =
      await res.json();

    if(cloud){

      extraEvs =
        cloud.extraEvs || extraEvs;

      overrideEvs =
        cloud.overrideEvs || overrideEvs;

      deletedIds =
        new Set(
          cloud.deletedIds ||
          [...deletedIds]
        );

      evIdCounter =
        cloud.counter || evIdCounter;

    }


    // 同步回 localStorage

    localStorage.setItem(
      STORE_KEY,
      JSON.stringify({

        extraEvs,
        overrideEvs,
        deletedIds:[...deletedIds],
        counter:evIdCounter

      })
    );

    setSyncBadge('cloud');

  }catch(e){

    console.error('cloud load error',e);
    setSyncBadge('local');

  }

}

function setSyncBadge(mode){
  const badge=document.getElementById('sync-badge');
  const text=document.getElementById('sync-text');
  if(!badge||!text) return;
  if(mode==='cloud'){
    badge.className='sync-badge sync-cloud';
    text.textContent='☁ 同步';
  }else if(mode==='local'){
    badge.className='sync-badge sync-local';
    text.textContent='⚠ 本機';
  }else{
    badge.className='sync-badge sync-loading';
    text.textContent='連線中';
  }
}


// ===== 儲存 =====

async function saveStore(){

  const data = {

    extraEvs,
    overrideEvs,
    deletedIds:[...deletedIds],
    counter:evIdCounter

  };


  // localStorage 備份

  try{

    localStorage.setItem(
      STORE_KEY,
      JSON.stringify(data)
    );

  }catch(e){

    console.error('local save error',e);

  }


  // Google Sheet 同步

  try{

await fetch(API_URL, {
  method: 'POST',
  body: JSON.stringify(data)
});

  }catch(e){

    console.error('cloud save error',e);
    setSyncBadge('local');

  }

  showToast();

}


// ===== 提示 =====

function showToast(){

  const t =
    document.getElementById('toast');

  if(!t) return;

  t.classList.add('show');

  setTimeout(
    ()=>t.classList.remove('show'),
    1800
  );

}


// ===== 初始化 =====

(async()=>{

  await loadStore();

  render();

})();

const BASE_FIX={
  '2026-05-24':[{w:'d',time:'14:00',loc:'華僑高中',ev:'小學生足球賽預賽'},{w:'a',time:'12:00',loc:'華僑高中',ev:'小學生足球賽預賽'},{w:'a',time:'14:00',loc:'華僑高中',ev:'小學生足球賽預賽'}],
  '2026-05-26':[{w:'d',time:'',loc:'',ev:'期末考'}],

function getAllEvs(dt){

  const extra=(extraEvs[k]||[]).filter(e=>!deletedIds.has(String(e.id)));
  return [...base,...extra].sort((a,b)=>sortKey(a.time)-sortKey(b.time));
}

function buildList(){
  let html='';
  for(const mk of Object.keys(months)){
    const{label,days}=months[mk];
    const julAug=mk.endsWith('-07')||mk.endsWith('-08');
    let rows='';
    for(const{d}of days){
      const evs=getAllEvs(d);
      const dow=d.getDay();const cls=dow===0?'sun':dow===6?'sat':'';
      const hasEv=evs.length>0;
      if(!julAug&&!hasEv) continue;
      let fEvs=activeWho?evs.filter(e=>e.w===activeWho):evs;
      if(activeWho&&fEvs.length===0) continue;
      if(!activeWho){if(activeSchedule==='has'&&!hasEv) continue;if(activeSchedule==='none'&&hasEv) continue;}
      const dateKey=dk(d);
      let pairsHtml='';
      if(fEvs.length){fEvs.forEach(e=>{pairsHtml+=`<div class="ev-plan-pair"><div class="ev-part">${renderEvLine(e,dateKey)}</div><div class="plan-part">${e.note||''}</div></div>`;});}
      else{pairsHtml=`<div class="ev-plan-pair"><div class="ev-part"><span class="muted">—</span></div><div class="plan-part"></div></div>`;}
      rows+=`<tr class="${cls}"><td class="date-td">${pad(d.getMonth()+1)}/${pad(d.getDate())}</td><td class="dow-td">週${DOW[dow]}</td><td colspan="2" style="padding:0;border-bottom:0.5px solid #f0f0ec">${pairsHtml}</td></tr>`;
    }
    if(rows) html+=`<div class="month-block"><div class="month-title">${label}</div><table class="list-table"><colgroup><col class="c-date"><col class="c-dow"><col class="c-ev"><col class="c-plan"></colgroup><thead><tr><th>日期</th><th>星期</th><th>事件</th><th>註記</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  document.getElementById('cal').innerHTML=html||'<div style="color:#aaa;padding:20px 0;font-size:14px">無符合行程</div>';
  updateStats();
}

function buildMonthCal(){
  let html='';
  for(const mk of Object.keys(months)){
    const{label,days}=months[mk];
    const firstD=days[0].d;const year=firstD.getFullYear(),month=firstD.getMonth();
    html+=`<div class="cal-grid"><div class="cal-grid-title">${label}</div><table class="cal-table"><thead><tr>`;
    ['日','一','二','三','四','五','六'].forEach((h,i)=>html+=`<th class="${i===0?'sun-h':i===6?'sat-h':''}">${h}</th>`);
    html+=`</tr></thead><tbody>`;
    const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
    let day=1;
    for(let row=0;row<6;row++){
      html+='<tr>';
      for(let col=0;col<7;col++){
        const ci=row*7+col;
        if(ci<firstDay||day>daysInMonth){html+='<td class="cal-cell empty"></td>';}
        else{
          const td=new Date(year,month,day);td.setHours(0,0,0,0);
          const inW=td>=calStart&&td<=calEnd;
          const isPast=!inW&&td<calStart;
          const isToday=td.getTime()===TODAY.getTime();
          const evs=getAllEvs(td);
          const dc=col===0?'sun':col===6?'sat':'';
          html+=`<td class="cal-cell${isPast?' past':''}"><div class="cal-date-wrap"><span class="cal-dn ${dc}${isToday?' today':''}">${day}</span></div>`;
          evs.forEach(e=>html+=`<div class="cal-ev cal-ev-${e.w}" onclick="openQuickEdit(event,'${dk(td)}','${e.id}')" title="點擊修改簡記">${e.calLabel||e.ev}</div>`);
          html+='</td>';day++;
        }
      }
      html+='</tr>';if(day>daysInMonth) break;
    }
    html+=`</tbody></table></div>`;
  }
  document.getElementById('cal').innerHTML=html;updateStats();
}

function positionPopup(popup,triggerEl){
  // 統一垂直置中＋最大高度，確保刪除/取消/儲存按鈕永遠可見
  const overlay=popup.previousElementSibling;
  if(overlay&&overlay.classList.contains('modal-overlay')){
    overlay.style.background='rgba(0,0,0,0.35)';
  }
  popup.style.position='fixed';
  popup.style.top='50%';
  popup.style.left='50%';
  popup.style.transform='translate(-50%,-50%)';
  popup.style.maxHeight='90vh';
  popup.style.overflowY='auto';
  popup.style.webkitOverflowScrolling='touch';
}

function handleDelEv(e, evIdToDelete){
  e.stopPropagation();
  if(!evIdToDelete){ closeModal(); return; }
  const confirmDelete=confirm('確定要刪除此行程嗎？\n刪除後將無法復原。');
  if(!confirmDelete) return;
  const isExtra=Object.values(extraEvs).some(arr=>arr.some(e=>String(e.id)===evIdToDelete));
  if(isExtra){
    for(const k of Object.keys(extraEvs)){
      extraEvs[k]=extraEvs[k].filter(e=>String(e.id)!==evIdToDelete);
    }
  }else{
    deletedIds.add(evIdToDelete);
    delete overrideEvs[evIdToDelete];
  }
  saveStore();
  document.getElementById('modal-container').innerHTML='';
  render();
}

let _editDateKey=null,_editEvId=null,_clipBoard=null;

function openAdd(evt,dateKey){
  _editDateKey=null;_editEvId=null;
  showModal('新增行程',dateKey||todayStr(),null,evt?evt.currentTarget:null);
}
function openEdit(evt,dateKey,evId){
  evt.stopPropagation();
  _editDateKey=dateKey;
  _editEvId=String(evId);

  // 不可在這裡 rebuildEvById()
  // 因為部分動態行程（例如 07/21 暑期練球）
  // 每次重建都會重新產生 id，導致抓不到原本事件
  // render() 時已經建立好 evById，直接使用即可

  let ev=evById[_editEvId]||null;

  // 確保所有欄位都有正確帶入
  if(ev){
    ev={
      id:String(ev.id||''),
      w:ev.w||'d',
      ev:ev.ev||'',
      time:ev.time||'',
      loc:ev.loc||'',
      target:ev.target||'',
      note:ev.note||'',
      calLabel:ev.calLabel||'',
      type:ev.type||'',
      lines:ev.lines||[]
    };

    // group 類型行程，自動整理時間與地點文字
    if(ev.type==='group' && Array.isArray(ev.lines) && ev.lines.length){
      const timeText=ev.lines.map(l=>l.time||'').filter(Boolean).join(' / ');
      const locText=ev.lines.map(l=>l.loc||'').filter(Boolean).join(' / ');

      if(!ev.time) ev.time=timeText;
      if(!ev.loc) ev.loc=locText;
    }
  }

  showModal('編輯行程',dateKey,ev,evt.currentTarget);
}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

function saveEv(){
  const dateVal=document.getElementById('m-date').value;
  const selectedDate=new Date(dateVal);
  selectedDate.setHours(0,0,0,0);

  // 限制只能新增 / 編輯 100 天內日期
  if(selectedDate<calStart || selectedDate>calEnd){
    alert('只能建立 100 天內的行程');
    return;
  }

  const w=document.getElementById('m-who').value;
  const evName=document.getElementById('m-ev').value.trim();
  const calLabelInput=document.getElementById('m-cal').value.trim();
  const loc=document.getElementById('m-loc').value.trim();
  const time=document.getElementById('m-time').value.trim();
  const target=document.getElementById('m-target').value.trim();
  const note=document.getElementById('m-note').value.trim();
  if(!evName){alert('請輸入事件名稱');return;}
  const calLabel=calLabelInput||(evName.length>6?evName.slice(0,6)+'…':evName);
  if(_editEvId){
    const isExtra=Object.values(extraEvs).some(arr=>arr.some(e=>String(e.id)===_editEvId));
    if(isExtra){
      for(const k of Object.keys(extraEvs)){
        const idx=extraEvs[k].findIndex(e=>String(e.id)===_editEvId);
        if(idx>=0){
          if(k!==dateVal){extraEvs[k].splice(idx,1);if(!extraEvs[dateVal])extraEvs[dateVal]=[];extraEvs[dateVal].push({id:_editEvId,w,ev:evName,calLabel,loc,time,target,note});}
          else{extraEvs[k][idx]={id:_editEvId,w,ev:evName,calLabel,loc,time,target,note};}
          break;
        }
      }
    } else {
      overrideEvs[_editEvId]={w,ev:evName,calLabel,loc,time,target,note};
    }
  } else {
    const newId=String(evIdCounter++);
    if(!extraEvs[dateVal]) extraEvs[dateVal]=[];
    extraEvs[dateVal].push({id:newId,w,ev:evName,calLabel,loc,time,target,note});
  }
  saveStore();
  document.getElementById('modal-container').innerHTML='';
  render();
}

function deleteEv(){
  if(!_editEvId){
    closeModal();
    return;
  }

  const confirmDelete=confirm('確定要刪除此行程嗎？\n刪除後將無法復原。');

  if(!confirmDelete) return;

  const isExtra=Object.values(extraEvs).some(arr=>arr.some(e=>String(e.id)===_editEvId));

  if(isExtra){
    for(const k of Object.keys(extraEvs)){
      extraEvs[k]=extraEvs[k].filter(e=>String(e.id)!==_editEvId);
    }
  }else{
    deletedIds.add(_editEvId);
    delete overrideEvs[_editEvId];
  }

  saveStore();
  document.getElementById('modal-container').innerHTML='';
  render();
}

// ===== 月曆簡記快速編輯 =====
let _qeDateKey=null, _qeEvId=null;

function openQuickEdit(evt, dateKey, evId){
  evt.stopPropagation();
  _qeDateKey=dateKey;
  _qeEvId=String(evId);
  const ev=evById[_qeEvId]||null;
  if(!ev) return;
  const curLabel=ev.calLabel||ev.ev||'';
  const whoClass=tclass(ev.w);
  const whoLabel=tlabel(ev.w);
  document.getElementById('modal-container').innerHTML=`
  <div class="qe-overlay" onclick="closeQuickEdit()"></div>
  <div class="qe-popup" id="qe-popup">
    <span class="qe-who tag ${whoClass}">${whoLabel}</span>
    <div class="qe-evname">${ev.ev}</div>
    <label>月曆簡記</label>
    <input type="text" id="qe-input" value="${curLabel}" placeholder="月曆顯示文字" maxlength="12">
    <div class="qe-hint">留空則自動使用事件名稱</div>
    <div class="qe-actions">
      <button onclick="closeQuickEdit()">取消</button>
      <button class="qe-btn-save" onclick="saveQuickEdit()">儲存</button>
    </div>
  </div>`;
  const popup=document.getElementById('qe-popup');
  popup.style.position='fixed';
  popup.style.top='50%';
  popup.style.left='50%';
  popup.style.transform='translate(-50%,-50%)';
  setTimeout(()=>{const inp=document.getElementById('qe-input');if(inp){inp.focus();inp.select();}},50);
}

function closeQuickEdit(){
  document.getElementById('modal-container').innerHTML='';
  _qeDateKey=null; _qeEvId=null;
}

function saveQuickEdit(){
  if(!_qeEvId) return;
  const newLabel=document.getElementById('qe-input').value.trim();
  const isExtra=Object.values(extraEvs).some(arr=>arr.some(e=>String(e.id)===_qeEvId));
  if(isExtra){
    for(const k of Object.keys(extraEvs)){
      const idx=extraEvs[k].findIndex(e=>String(e.id)===_qeEvId);
      if(idx>=0){extraEvs[k][idx].calLabel=newLabel;break;}
    }
  } else {
    overrideEvs[_qeEvId]={...(overrideEvs[_qeEvId]||{}), calLabel:newLabel};
  }
  saveStore();
  closeQuickEdit();
  render();
}
// ===== 記事本 =====
let _noteVisible=false;
function toggleNotebook(btn){
  _noteVisible=!_noteVisible;
  const page=document.getElementById('notebook-page');
  const calEl=document.getElementById('cal');
  const stats=document.getElementById('filter-section');
  const statsBar=document.querySelector('.stats');
  if(_noteVisible){
    page.classList.add('active');
    calEl.style.display='none';
    if(stats) stats.style.display='none';
    if(statsBar) statsBar.style.display='none';
    btn.classList.add('on');
    const hint=document.getElementById('note-hint');
    if(hint) hint.style.display='block';
    // 載入儲存的內容
    const saved=localStorage.getItem('huang_notebook')||'';
    const ta=document.getElementById('nb-textarea');
    ta.value=saved;
    ta.oninput=function(){ localStorage.setItem('huang_notebook',this.value); };
  }else{
    page.classList.remove('active');
    calEl.style.display='';
    if(stats) stats.style.display='';
    if(statsBar) statsBar.style.display='';
    btn.classList.remove('on');
    const hint=document.getElementById('note-hint');
    if(hint) hint.style.display='none';
  }
}
